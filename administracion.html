        /* CORREGIDO: Se completaron los valores truncados */

        .btn-cocina { background: #ffc107; color: black; }
        .btn-cobrar { background: #28a745; color: white; margin-left: 10px; }
        .estatus { float: right; font-size: 12px; text-transform: uppercase; padding: 4px; background: #444; }
    </style>
</head>

        <div>
