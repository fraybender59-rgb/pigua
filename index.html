<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesas Inteligentes - Áreas de Producción</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 style="color: #ff5722; font-family: monospace; margin: 0;">🍽️ Sistema de Comandeo por Áreas</h1>
  </header>
  
  <div class="app-layout">
    
    <main class="catalog-section">
      <div id="menu-items-grid"></div>
    </main>
    
    <aside class="order-section">
      <h2>Comanda Activa</h2>
      <div class="table-selector">
        <label>Mesa # </label>
        <input type="number" id="table-number" value="1" min="1" max="30">
      </div>
      
      <div id="order-items-list">
        <p class="empty-msg">No hay productos en la comanda.</p>
      </div>
      
      <div class="order-total">
        <span>TOTAL:</span>
        <span id="order-total-amount">$0.00</span>
      </div>
      
      <button id="btn-send-production" class="btn-warning">🔥 Mandar a Producción (Cocina/Barra)</button>
      <button id="btn-generate-check" class="btn-success">🧾 Generar Cuenta Cliente</button>
      
      <div id="ticket-print-area" style="display: none;"></div>
    </aside>

  </div>

  <script src="app.js"></script>
</body>
</html>
